<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaderboards</title>
    <link rel="icon" href="logo2.png" />
    <link rel="stylesheet" href="leaderboards.css" />
    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  </head>
  <body>
   
<nav id="navbar">

    <div class="nav-brand">
        <img id="logo" height="60" alt="" src="logo.png" />
        <a class="nav-title" href="index.html">LEXIFY</a>
    </div>

    <button class="menu-toggle" onclick="toggleMenu()" aria-label="Toggle menu">
        <i class="fa-solid fa-bars"></i>
    </button>

    <ul id="navLinks">

        <li>
            <a href="index.html" onclick="closeMenu()" class="nav-link">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </a>
        </li>

        <li>
            <a href="mp3/mp3.html" onclick="closeMenu()" class="nav-link">
                <i class="fa-solid fa-music"></i>
                <span>MP3</span>
            </a>
        </li>

        <li>
            <a href="leaderboards.html" onclick="closeMenu()" class="nav-link">
                <i class="fa-solid fa-ranking-star"></i>
                <span>Leaderboards</span>
            </a>
        </li>

        <li>
            <button id="downloadBtn" onclick="closeMenu(); openPopup()">
                <i class="fa-solid fa-download"></i>
                <span>Download</span>
            </button>
        </li>

    </ul>

</nav>


<div class="popup" id="popup" onclick="closePopup()">
  <div class="popup-content" onclick="closePopup()">
    <!-- <span class="close" onclick="closePopup()">&times;</span> -->
    <div class="embed-container">
      <iframe
        frameborder="0"
        src="https://itch.io/embed/3571001?linkback=true&amp;border_width=5&amp;bg_color=00073e&amp;fg_color=eeeeee&amp;link_color=0094bc&amp;border_color=003280"
        width="560"
        height="175"
        ><a href="https://lexifyco.itch.io/lexify-2"
          >Lexify 2 by LexifyCo</a
        ></iframe
      >
    </div>

    <div class="embed-container">
      <iframe
        frameborder="0"
        src="https://itch.io/embed/3954172?border_width=3&amp;bg_color=000414&amp;fg_color=25dfff&amp;link_color=5be2fa&amp;border_color=00c6de"
        width="556"
        height="171"
        ><a href="https://lexifyco.itch.io/lexify-3"
          >Lexify 3 by LexifyCo</a
        ></iframe
      >
    </div>
  </div>
</div>


    <section class="leaderboard">
      <div class="leaderboard-header">
        <!-- <span class="leaderboard-label">LEXIFY COMPETITIVE</span> -->
        <h1>LEADERBOARDS</h1>
        <p>Some Lexify 3 Minigames</p>
      </div>

      <div class="leaderboard-content">
        <div class="leaderboard-title">
          <h2 id="boardTitle">Gun Score</h2>
          <span>TOP 10</span>
        </div>

        <div class="leaderboard-columns">
          <span>RANK</span>
          <span>PLAYER</span>
          <span>SCORE</span>
        </div>

        <div id="leaderboardResults">
          <p class="leaderboard-loading">Loading leaderboard...</p>
        </div>
      </div>

      <br>
      <div class="leaderboard-tabs">
        <button class="leaderboard-tab active" data-board="gun_score">
          Gun Combo
        </button>
        <button class="leaderboard-tab" data-board="ball_score">
          Dunks
        </button>
         <button class="leaderboard-tab" data-board="swings">Swings</button>
        <button class="leaderboard-tab" data-board="speedrun_time">
          Speedrun
        </button>
       
      </div>

      <div class="leaderboard-footer">
        <span></span>
        <span>Get your spot in Lexify 3!</span>
      </div>
    </section>

    <script src="index.js"></script>
  </body>
</html>
